<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2a1838" />
    <title>Jahannam Diorama</title>
    <meta name="description" content="A tactile cartoon cross-section of the seven gates: drag critters, poke props, bend the physics." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
    <div id="stage"></div>

    <!-- Gate Elevator rail -->
    <nav id="rail" aria-label="Gate elevator">
      <button data-floor="0" title="The Rim (arrivals)" aria-label="The Rim">
        <svg viewBox="0 0 24 24"><path d="M12 3c-4 3.4-7 6.5-7 10.2C5 17 8 20 12 20s7-3 7-6.8C19 9.5 16 6.4 12 3z" fill="currentColor" opacity=".9"/></svg>
      </button>
      <button data-floor="1" title="Gate 1 · Jahannam · the Cauldron">1</button>
      <button data-floor="2" title="Gate 2 · Laza · Peel &amp; Pluck">2</button>
      <button data-floor="3" title="Gate 3 · al-Hutamah · the Crusher">3</button>
      <button data-floor="4" title="Gate 4 · al-Sa'ir · the Zaqqum tree">4</button>
      <button data-floor="5" title="Gate 5 · Saqar · the Conveyor">5</button>
      <button data-floor="6" title="Gate 6 · al-Jahim · Zamharir cold">6</button>
      <button data-floor="7" title="Gate 7 · al-Hawiyah · the Abyss">7</button>
    </nav>

    <!-- Critter tray -->
    <div id="tray" role="toolbar" aria-label="Critters and tools">
      <div id="trayCritters"></div>
    </div>

    <!-- corner buttons -->
    <div id="corner">
      <button id="tinkerBtn" title="Tinker (physics sliders)" aria-label="Tinker">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="2.4" rx="1.2" fill="currentColor" opacity=".55"/><circle cx="9" cy="6.2" r="2.6" fill="currentColor"/><rect x="4" y="11" width="16" height="2.4" rx="1.2" fill="currentColor" opacity=".55"/><circle cx="15.5" cy="12.2" r="2.6" fill="currentColor"/><rect x="4" y="17" width="16" height="2.4" rx="1.2" fill="currentColor" opacity=".55"/><circle cx="7" cy="18.2" r="2.6" fill="currentColor"/></svg>
      </button>
      <button id="plaqueBtn" title="Plaque (sources for this gate)" aria-label="Plaque">
        <svg viewBox="0 0 24 24"><path d="M12 2.5c.9 2 2.4 3 4.2 3.3-1 1.3-1 3 0 4.4-1.6.2-3 1.1-4.2 2.6-1.2-1.5-2.6-2.4-4.2-2.6 1-1.4 1-3.1 0-4.4C9.6 5.5 11.1 4.5 12 2.5z" fill="currentColor"/><path d="M6.5 13.2h11c.8 0 1.5.7 1.5 1.5v5.3c0 .8-.7 1.5-1.5 1.5h-11c-.8 0-1.5-.7-1.5-1.5v-5.3c0-.8.7-1.5 1.5-1.5z" fill="currentColor" opacity=".55"/></svg>
      </button>
      <button id="logBtn" title="Discoveries: ways they popped" aria-label="Discoveries">
        <svg viewBox="0 0 24 24"><path d="M4 15.5 12 4l8 11.5z" fill="currentColor"/><ellipse cx="12" cy="17" rx="9" ry="3.2" fill="currentColor" opacity=".55"/><circle cx="12" cy="3.6" r="1.8" fill="currentColor"/></svg>
        <b id="logCount" hidden>0</b>
      </button>
      <button id="muteBtn" title="Sound on/off" aria-label="Mute">
        <svg class="on" viewBox="0 0 24 24"><path d="M4 9.5h3.3L12 5.2v13.6l-4.7-4.3H4z" fill="currentColor"/><path d="M15 8.6a4.6 4.6 0 0 1 0 6.8M17.4 6.2a8 8 0 0 1 0 11.6" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
        <svg class="off" viewBox="0 0 24 24"><path d="M4 9.5h3.3L12 5.2v13.6l-4.7-4.3H4z" fill="currentColor"/><path d="m15.5 9.5 5 5m0-5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <aside id="tinker" class="drawer right" aria-label="Tinker" hidden>
      <header><h2>Tinker</h2><button class="x" data-close aria-label="Close">×</button></header>
      <div id="sliders"></div>
      <button id="resetSliders" class="ghost">Reset sliders</button>
    </aside>

    <aside id="plaque" class="drawer left" aria-label="Plaque" hidden>
      <header><h2 id="plaqueTitle">Plaque</h2><button class="x" data-close aria-label="Close">×</button></header>
      <div id="plaqueBody"></div>
    </aside>

    <div id="logPanel" class="modal" hidden>
      <div class="card">
        <header><h2>Ways they popped</h2><button class="x" data-close aria-label="Close">×</button></header>
        <p class="sub">Each new kind of cartoon pop unlocks a silly hat. Every critter regrows in a second and a half.</p>
        <div id="logList"></div>
        <button id="resetLog" class="ghost">Forget discoveries</button>
      </div>
    </div>

    <div id="quip" aria-live="polite"></div>
    <div id="toasts" aria-live="polite"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
